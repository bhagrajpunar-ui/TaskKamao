name: taskkamao
description: "TaskKamao - Task karo, coins kamao. Rewards app (earn coins from tasks, withdraw via UPI)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  # Tested target: Flutter 3.24.x stable (Dart 3.5). Newer 3.x should also work.

dependencies:
  flutter:
    sdk: flutter

  # Firebase (FlutterFire, versions released together - keep them in sync)
  firebase_core: 3.6.0
  firebase_auth: 5.3.1
  cloud_firestore: 5.4.4
  cloud_functions: 5.1.3
  firebase_app_check: 0.3.1+3

  # Ads
  google_mobile_ads: 5.2.0

  # State management
  flutter_riverpod: 2.6.1

  # Utilities
  share_plus: 10.1.2
  url_launcher: 6.3.1
  shared_preferences: 2.3.3
  android_id: 0.4.0
  uuid: 4.5.1
  intl: 0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0

flutter:
  uses-material-design: true
